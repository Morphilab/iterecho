[project]
name = "iterecho"
dynamic = ["version"]
description = "Secure file processor with copy, concatenate and chunk modes"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [
    { name = "morphilab", email = "lab@morphilab.com" },
]
keywords = [
    "file-processing",
    "cli",
    "security",
    "concatenation",
    "file-copy",
    "file-chunk",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "Topic :: System :: Filesystems",
    "Topic :: Security",
]
dependencies = [
    "tqdm>=4.66",
    "typer>=0.12",
    "rich>=13.0",
    "shellingham>=1.5",
]

[project.scripts]
iterecho = "iterecho.cli:app"

[project.urls]
Homepage = "https://github.com/Morphilab/iterecho"
Repository = "https://github.com/Morphilab/iterecho.git"
"Bug Tracker" = "https://github.com/Morphilab/iterecho/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black>=22.1.0",
    "isort",
    "ruff",
    "mypy",
    # Everything the PR checklist and the local quality gate ask for, so
    # `uv sync --extra dev` is enough. Versions are pinned per Python in
    # uv.lock (3.8..3.14 each resolve their own).
    "bandit",
    "pip-audit",
    "pre-commit",
    "build",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["iterecho"]

[tool.hatch.build.targets.sdist]
include = [
    "iterecho",
    "tests",
    "README.md",
    "README.es.md",
    "LICENSE",
    "SECURITY.md",
    "pyproject.toml",
]

[tool.hatch.version]
path = "iterecho/__init__.py"

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312", "py313", "py314"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]   # B008 is normal for Typer defaults

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
