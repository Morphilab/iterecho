# See https://pre-commit.com for documentation.
#
# Install:
#   pip install pre-commit
#   pre-commit install
#
# Run on demand (CI does this too):
#   pre-commit run --all-files
#
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        exclude: ^\.github/workflows/
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ["--branch=main", "--branch=master"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  - repo: https://github.com/pycqa/isort
    rev: 9.0.2
    hooks:
      - id: isort
        # These revs must match what uv resolves for the lint job: the dev
        # extra is unpinned on purpose (3.8..3.14 each get their own version,
        # frozen in uv.lock) and CI runs the linters on Python 3.12, whose
        # resolution is the one mirrored here. `.pre-commit-config.yaml` is
        # checked against the installed versions by
        # .github/scripts/check_tool_pins.py in the lint job.
        args: ["--profile", "black", "--line-length", "100"]

  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
        args: ["--line-length", "100"]
        language_version: python3

  # mypy intentionally omitted from pre-commit: it requires the strict config
  # from pyproject.toml and is slow. CI runs the full check via the lint job.
  # To run locally: mypy iterecho/
