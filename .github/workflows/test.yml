name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      # setup-uv is pinned by commit SHA; uv itself is pinned below.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.24"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-python: true
          cache-dependency-glob: uv.lock

      - name: Verify uv.lock is up to date
        run: uv lock --check

      - name: Install (app + dev)
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}

      - name: ruff
        run: uv run --no-sync ruff check iterecho/ tests/

      - name: black
        run: uv run --no-sync black --check --line-length 100 iterecho/ tests/

      - name: isort
        run: uv run --no-sync isort --check --profile black iterecho/ tests/

      - name: mypy
        run: uv run --no-sync mypy iterecho/

      - name: pre-commit pins vs locked linters
        run: uv run --no-sync python .github/scripts/check_tool_pins.py

  test:
    name: Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.24"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-python: true
          cache-dependency-glob: uv.lock

      - name: Verify uv.lock is up to date
        run: uv lock --check

      - name: Install (app + dev)
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}

      - name: Run tests with pytest
        run: |
          uv run --no-sync pytest --cov=iterecho --cov-report=xml -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  security:
    name: Security
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.24"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-python: true
          cache-dependency-glob: uv.lock

      - name: Verify uv.lock is up to date
        run: uv lock --check

      - name: Install app
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: bandit (static analysis)
        run: uvx bandit -r iterecho/ -q -ll

      - name: pip-audit (dependency vulnerabilities)
        # We do not use --strict because the local project itself is not on PyPI
        # (the warning is harmless); vulnerabilities in our declared dependencies
        # (tqdm, typer) and their transitive closure WILL fail the job.
        run: uvx pip-audit --skip-editable

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.24"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-python: true
          cache-dependency-glob: uv.lock

      - name: Verify uv.lock is up to date
        run: uv lock --check

      - name: Build sdist and wheel
        run: uv build

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.24"
          python-version: ${{ matrix.python-version }}
          enable-cache: false
          cache-python: false

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch
